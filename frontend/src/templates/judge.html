<!DOCTYPE html>
<html>
<head>
    <title>Giudice - Chat</title>
    <link rel="stylesheet" href="../static/judge.css">
</head>
<body>
    <div class="container">
        <div class="mode-badge">👨‍⚖️ Giudice</div>

        <div class="status-info">
            <!-- 🆔 ID: <span id="ws-id"></span> |  -->
            🏠 Room: <span id="room-id">Nessuna</span>
        </div>

        <!-- Form per inviare domande -->
        <div class="question-form">
            <input type="text" id="questionInput" placeholder="✍️ Scrivi una domanda..." />
            <button class="send-button" onclick="sendQuestion()">📤 Invia</button>
        </div>

        <div id="judgmentContainer"></div>

        <!-- Chat con risposte -->
        <div class="dual-chat">
            <div class="chat-box">
                <h3>🟢 Risposte Player A</h3>
                <ul id="messagesA"></ul>
            </div>
            <div class="chat-box">
                <h3>🔴 Risposte Player B</h3>
                <ul id="messagesB"></ul>
            </div>
        </div>
    </div>

    <script src="/static/judge.js" type="module"></script>
</body>
</html>
