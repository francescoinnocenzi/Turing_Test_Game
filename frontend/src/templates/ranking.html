<!DOCTYPE html>
<html>
<head>
    <title>Turing Test Game - Classifica</title>
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background: linear-gradient(135deg, #0f0f23 0%, #16213e 25%, #1a1a2e 50%, #0f0f23 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;

        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }

        .title {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px #00ffffc1;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0px;
            color: #00ffff;
            text-align: center;
            margin-bottom: 3rem;
        }

        .mode-badge{
            text-shadow: 0 0 10px #00ffffc1;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 3rem;
            font-weight: 700;
            color: #00ffff;
            font-family: 'Share Tech Mono', monospace;
        }

        .container {
            width: 80%;
            background: rgba(0, 255, 255, 0.03);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #ffffff;
            margin-bottom: 2rem;
            font-size: 1.2rem;
            line-height: 1.4;
        }

        .mode-button:hover{
            background: rgba(0, 255, 255, 0.1);
            border-color: #00ffff;
            transform: translateY(-7px);
        }

        .button-group {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
        }

        .refresh-btn {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
            margin-bottom: 1rem;
            font-size: 1rem;
            font-family: 'Share Tech Mono', monospace;
        }

        .refresh-btn:hover {
            background: rgba(0, 255, 255, 0.1);
            border-color: #00ffff;
            transform: translateY(-7px);
        }

        a{
            text-decoration: none;
        }

        .menu-btn {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
            margin-bottom: 1rem;
            font-size: 1rem;
            font-family: 'Share Tech Mono', monospace;
        }

        .back-link {
            margin-top: 1rem;
            display: inline-block;
            text-decoration: none;
            color: #00ffff;
            font-weight: bold;
            font-size: 1rem;
            margin: 0;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            margin-top: 2rem;
        }
        
        .back-link:hover {
            color: #20e1e1;
            text-decoration: underline;
        }

        .menu-btn:hover {
            background: rgba(0, 255, 255, 0.1);
            border-color: #00ffff;
            transform: translateY(-7px);
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
        }

        .ranking-table th, .ranking-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ccc;
        }

        .footer {
            margin-top: 2rem;
            color: #999;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 2rem;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🏆 Classifica</h1>
        <div class="subtitle">
            I migliori giocatori del Turing Test Game
        </div>
        <div class="footer">
            Gioca e cerca di arrivare in cima alla classifica!
        </div>

        <div class="button-group">
            <button id="refresh-ranking" class="btn refresh-btn">🔄 Aggiorna classifica</button>
            <a href="/index" class="btn menu-btn">🏠 Torna al menu</a>
        </div>

        <div id="ranking-container">
            <p>Caricamento classifica...</p>
        </div>

        <a href="/index" class="back-link">← Torna alla Home</a>
    </div>

    <script src="/static/ranking.js"></script>
</body>
</html>
