<!DOCTYPE html>
<html>
<head>
    <title>Turing Test Game - Multiplayer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 3rem;
            font-size: 1.2rem;
            line-height: 1.4;
        }
        
        .role-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .role-button {
            display: block;
            padding: 1.5rem 2rem;
            text-decoration: none;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .judge-button {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }
        
        .judge-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 107, 107, 0.4);
        }
        
        .player-button {
            background: linear-gradient(135deg, #4834d4, #686de0);
            color: white;
            box-shadow: 0 8px 20px rgba(72, 52, 212, 0.3);
        }
        
        .player-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(72, 52, 212, 0.4);
        }
        
        .role-description {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 0.5rem;
            font-weight: normal;
        }
        
        .back-link {
            margin-top: 2rem;
            display: inline-block;
            text-decoration: none;
            color: #764ba2;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            color: #667eea;
            text-decoration: underline;
        }
        
        .footer {
            margin-top: 3rem;
            color: #999;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 2rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .role-button {
                padding: 1.2rem 1.5rem;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👥 Modalità Multiplayer</h1>
        <div class="subtitle">
            Scegli il tuo ruolo per giocare con un altro partecipante:
        </div>
        
        <div class="role-buttons">
            <a href="/judge" class="role-button judge-button">
                👨‍⚖️ GIUDICE
                <div class="role-description">
                    Fai domande e valuta le risposte dei partecipanti
                </div>
            </a>
            
            <a href="/player" class="role-button player-button">
                👤 PARTECIPANTE
                <div class="role-description">
                    Rispondi alle domande del giudice
                </div>
            </a>
        </div>
        
        <a href="/" class="back-link">← Torna alla Home</a>
        
        <div class="footer">
            Seleziona un ruolo per accedere all'interfaccia di chat
        </div>
    </div>
</body>
</html>
