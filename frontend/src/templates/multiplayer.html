<!DOCTYPE html>
<html>
<head>
    <title>Multiplayer - Scegli Ruolo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 { font-size: 2rem; margin-bottom: 2rem; color: #333; }
        .mode-button {
            display: inline-block;
            width: 85%;
            margin: 0.5rem;
            padding: 1.2rem 1rem;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .judge-button { background: linear-gradient(135deg, #1abc9c, #16a085); }
        .player-button { background: linear-gradient(135deg, #3498db, #2980b9); }
        .mode-button:hover { transform: scale(1.05); }

        /* Modale */
        .overlay {
            position: fixed; inset:0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            position: relative;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .modal h2 { margin-bottom: 1rem; }
        .close-btn {
            position: absolute; top: 10px; right: 10px;
            border: none; background: none; font-size: 1.2rem; cursor: pointer;
        }
        .room-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 1rem 0;
            padding: 0;
            list-style: none;
        }
        .room-list li {
            padding: 0.8rem;
            margin: 0.3rem 0;
            background: #f0f0f0;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .room-list li:hover {
            background: #dcdcdc;
        }
        .refresh-btn {
            margin-top: 0.5rem;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg,#ff6b6b,#ee5a24);
            color: white;
            font-weight: bold;
        }
        .mode-description {
            font-size: 0.95rem;
            font-weight: 400;
            color: white;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 Multiplayer - Scegli il tuo ruolo</h1>
    <div>
        <div class="mode-button judge-button" onclick="createJudgeSession()">
            👤 JUDGE
            <div class="mode-description">Crea una nuova partita come giudice</div>
        </div>

        <div class="mode-button player-button" onclick="openModal()">
            👤 PLAYER
            <div class="mode-description">Unisciti a una partita come giocatore</div>
        </div>
    </div>
</div>

<!-- Modale -->
<div class="overlay" id="modalOverlay">
    <div class="modal">
        <button class="close-btn" onclick="closeModal()">❌</button>
        <h2>Stanze disponibili</h2>
        <ul class="room-list" id="roomList"></ul>
        <button class="refresh-btn" onclick="loadRooms()">🔄 Aggiorna</button>
    </div>
</div>

<script>
async function createJudgeSession() {
    try {
        const response = await fetch("http://localhost:8003/create/session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ mode: "multi" }) // Passo il mode
        });
        if (!response.ok) throw new Error("Errore creazione sessione");
        const data = await response.json();
        window.location.href = "/judge_multi?room=" + encodeURIComponent(data.room_name);
    } catch (e) {
        alert("Errore: " + e.message);
    }
}

function openModal() {
    document.getElementById("modalOverlay").style.display = "flex";
    loadRooms();
}

function closeModal() {
    document.getElementById("modalOverlay").style.display = "none";
}

async function loadRooms() {
    const roomList = document.getElementById("roomList");
    roomList.innerHTML = "<li>Caricamento...</li>";
    try {
        const response = await fetch("http://localhost:8003/available/sessions", {
            credentials: "include"
        });
        if (!response.ok) throw new Error("Errore caricamento stanze");
        const data = await response.json();
        roomList.innerHTML = "";

        if (data.available_sessions.length === 0) {
            roomList.innerHTML = "<li>Nessuna stanza disponibile</li>";
            return;
        }

        data.available_sessions.forEach(session => {
            const li = document.createElement("li");
            li.textContent = session.room_name;
            li.onclick = () => joinRoom(session.room_name);
            roomList.appendChild(li);
        });
    } catch (e) {
        roomList.innerHTML = "<li>Errore: " + e.message + "</li>";
    }
}

async function joinRoom(roomName) {
    try {
        const response = await fetch(`http://localhost:8003/join/session/${roomName}`, {
            method: "POST",
            credentials: "include"
        });

        if (response.status === 409) {
            alert("⚠️ La stanza è già occupata, scegline un’altra.");
            return;
        }

        if (!response.ok) throw new Error("Errore join sessione");

        window.location.href = "/player_multi?room=" + encodeURIComponent(roomName);
    } catch (e) {
        alert("Errore: " + e.message);
    }
}

</script>
</body>
</html>
