<!DOCTYPE html>
<html>
<head>
    <title>Multiplayer - Scegli Ruolo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 { font-size: 2rem; margin-bottom: 2rem; color: #333; }
        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .mode-button {
            display: block;
            padding: 1.5rem 2rem;
            text-decoration: none;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        
        .mode-a-button {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }
        
        .mode-a-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 107, 107, 0.4);
        }
        
        .mode-b-button {
            background: linear-gradient(135deg, #4834d4, #686de0);
            color: white;
            box-shadow: 0 8px 20px rgba(72, 52, 212, 0.3);
        }
        
        .mode-b-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(72, 52, 212, 0.4);
        }

        /* Modale */
        .overlay {
            position: fixed; inset:0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            position: relative;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .modal h2 { margin-bottom: 1rem; }
        .close-btn {
            position: absolute; top: 10px; right: 10px;
            border: none; background: none; font-size: 1.2rem; cursor: pointer;
        }
        .room-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 1rem 0;
            padding: 0;
            list-style: none;
        }
        .room-list li {
            padding: 0.8rem;
            margin: 0.3rem 0;
            background: #f0f0f0;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .room-list li:hover {
            background: #dcdcdc;
        }
        .refresh-btn {
            margin-top: 0.5rem;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg,#ff6b6b,#ee5a24);
            color: white;
            font-weight: bold;
        }
        .mode-description {
            font-size: 0.95rem;
            font-weight: 400;
            color: white;
            margin-top: 0.3rem;
        }
        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 Multiplayer - Scegli il tuo ruolo</h1>
    <div class="mode-buttons">
        <div class="mode-button mode-a-button" onclick="createJudgeSession()">
            👤 JUDGE
            <div class="mode-description">Crea una nuova partita come giudice</div>
        </div>

        <div class="mode-button mode-b-button" onclick="openModal()">
            👤 PLAYER
            <div class="mode-description">Unisciti a una partita come giocatore</div>
        </div>
    </div>
</div>

<!-- Modale -->
<div class="overlay" id="modalOverlay">
    <div class="modal">
        <button class="close-btn" onclick="closeModal()">❌</button>
        <h2>Stanze disponibili</h2>
        <ul class="room-list" id="roomList"></ul>
        <button class="refresh-btn" onclick="loadRooms()">🔄 Aggiorna</button>
    </div>
</div>

<script src="/static/multiplayer.js" type="module"></script>
</body>
</html>
