<!DOCTYPE html>
<html>
<head>
    <title>Multiplayer - PLAYER</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%); 
            min-height:100vh; 
            padding:2rem; 
        }
        .container { 
            max-width:700px; 
            margin:0 auto; 
            background:white; 
            border-radius:20px; 
            padding:2rem; 
            box-shadow:0 20px 40px rgba(0,0,0,0.15); 
        }
        h1 { 
            font-size:2.5rem; 
            color:#333; 
            margin-bottom:2rem; 
            text-align:center; 
        }
        .status-info { 
            background:linear-gradient(135deg, #ff6b6b, #ee5a24); 
            color:white; 
            padding:1rem; 
            border-radius:15px; 
            font-weight:bold; 
            text-align:center; 
            margin-bottom:2rem; 
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }
        .current-question { 
            font-size:1.4rem; 
            background:#fff7e6; 
            border:2px dashed #f0ad4e; 
            color:#663c00; 
            font-weight:700; 
            padding:1.8rem; 
            border-radius:15px; 
            margin-bottom:2rem; 
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
        }
        .answer-form { 
            background:#f9f9f9; 
            padding:1.5rem; 
            border-radius:15px; 
            border:2px solid #eee; 
            text-align:center; 
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
        }
        .answer-form input { 
            width:65%; 
            padding:0.9rem; 
            font-size:1rem; 
            border-radius:10px; 
            border:2px solid #ddd; 
            margin-right:0.5rem;
        }
        .answer-form button { 
            padding:0.9rem 1.2rem; 
            border:none; 
            border-radius:10px; 
            background:#28a745; 
            color:white; 
            font-size:1rem; 
            cursor:pointer; 
            transition:0.2s;
        }
        .answer-form button:disabled {
            background: #bbb;
            cursor: not-allowed;
        }
        .answer-form button:hover:not(:disabled) { 
            background:#218838; 
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎮 PLAYER</h1>

    <div class="status-info" id="statusInfo">
        🏠 Room: <span id="room-id">Nessuna</span> | 🆔 ID: <span id="ws-id"></span>
    </div>

    <div id="current-question" class="current-question waiting">
        ⏳ In attesa di una domanda dal giudice...
    </div>

    <div class="answer-form">
        <form id="messageForm" onsubmit="return false;">
            <input type="text" id="messageText" disabled="true" autocomplete="off" placeholder="⏳ Attendi la domanda del giudice..." />
            <button type="submit" disabled="true" class="send-button">📤 Invia Risposta</button>
        </form>
    </div>
</div>

<script>
let ws = null;
let clientId = Math.floor(Math.random()*100000);
let role = 'HUMAN'; 
let pendingQuestions = [];
let currentQuestionId = null;

// Recupera la stanza dall’URL
function getRoomNameFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("room");
}

let roomName = getRoomNameFromUrl();
if (!roomName) {
    alert("⚠️ Nessuna stanza trovata nell’URL!");
    throw new Error("Room non trovata");
}


// Mostra info su pagina
document.getElementById("room-id").textContent = roomName;
document.getElementById("ws-id").textContent = clientId;

// Connetti al WebSocket
const url = `ws://localhost:8003/ws/${roomName}/${clientId}?role=${role}&mode=multi`;
ws = new WebSocket(url);

ws.onopen = () => console.log(`✅ Connesso come ${role} in modalità multi nella stanza ${roomName}`);

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    
    // Ricezione domanda
    if(data.type === "question"){
        console.log("❓ Domanda ricevuta:", data.text);
        pendingQuestions.push(data.text);
        const qBox = document.getElementById("current-question");
        qBox.textContent = "❓ " + data.text;
        enableForm();

        if (data.question_id) {
            currentQuestionId = data.question_id;
        }
    }

    // Fine round
    else if(data.type === "all_answered" && Array.isArray(data.answers)){
        pendingQuestions = [];
        disableForm();
        document.getElementById("current-question").textContent = "⏳ In attesa di una nuova domanda...";
    }

    // Gioco terminato
    else if(data.type === "final_judgment"){
        alert("🏁 Gioco terminato: " + data.judgment);
    }
};

function enableForm(){
    document.getElementById("messageText").disabled = false;
    document.querySelector(".send-button").disabled = false;
    document.getElementById("messageText").placeholder = "✍️ Scrivi la tua risposta...";
}

function disableForm(){
    document.getElementById("messageText").disabled = true;
    document.querySelector(".send-button").disabled = true;
    document.getElementById("messageText").placeholder = "⏳ Attendi la domanda del giudice...";
}

// 🚀 Invio risposta al server
document.getElementById("messageForm").addEventListener("submit", (e) => {
    e.preventDefault(); // evita reload form
    const input = document.getElementById("messageText");
    const answer = input.value.trim();

    if(answer && ws.readyState === WebSocket.OPEN){
        ws.send(JSON.stringify({
            type: "answer",
            from: clientId,
            text: answer,
            question_id: currentQuestionId
        }));
        console.log("📤 Risposta inviata:", answer);

        // reset input
        input.value = "";
        disableForm();
    }
});

</script>
</body>
</html>
