<!DOCTYPE html>
<html>
<head>
    <title>Multiplayer - PLAYER</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%); 
            min-height:100vh; 
            padding:2rem; 
        }
        .container { 
            max-width:700px; 
            margin:0 auto; 
            background:white; 
            border-radius:20px; 
            padding:2rem; 
            box-shadow:0 20px 40px rgba(0,0,0,0.15); 
        }
        h1 { 
            font-size:2.5rem; 
            color:#333; 
            margin-bottom:2rem; 
            text-align:center; 
        }
        .status-info { 
            background:linear-gradient(135deg, #ff6b6b, #ee5a24); 
            color:white; 
            padding:1rem; 
            border-radius:15px; 
            font-weight:bold; 
            text-align:center; 
            margin-bottom:2rem; 
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }
        .current-question { 
            font-size:1.4rem; 
            background:#fff7e6; 
            border:2px dashed #f0ad4e; 
            color:#663c00; 
            font-weight:700; 
            padding:1.8rem; 
            border-radius:15px; 
            margin-bottom:2rem; 
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
        }
        .answer-form { 
            background:#f9f9f9; 
            padding:1.5rem; 
            border-radius:15px; 
            border:2px solid #eee; 
            text-align:center; 
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
        }
        .answer-form input { 
            width:65%; 
            padding:0.9rem; 
            font-size:1rem; 
            border-radius:10px; 
            border:2px solid #ddd; 
            margin-right:0.5rem;
        }
        .answer-form button { 
            padding:0.9rem 1.2rem; 
            border:none; 
            border-radius:10px; 
            background:#28a745; 
            color:white; 
            font-size:1rem; 
            cursor:pointer; 
            transition:0.2s;
        }
        .answer-form button:disabled {
            background: #bbb;
            cursor: not-allowed;
        }
        .answer-form button:hover:not(:disabled) { 
            background:#218838; 
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎮 PLAYER</h1>

    <div class="status-info" id="statusInfo">
        🏠 Room: <span id="room-id">Nessuna</span> | 🆔 ID: <span id="ws-id"></span>
    </div>

    <div id="current-question" class="current-question waiting">
        ⏳ In attesa di una domanda dal giudice...
    </div>

    <div class="answer-form">
        <form id="messageForm" onsubmit="return false;">
            <input type="text" id="messageText" disabled="true" autocomplete="off" placeholder="⏳ Attendi la domanda del giudice..." />
            <button type="submit" disabled="true" class="send-button">📤 Invia Risposta</button>
        </form>
    </div>
</div>

<script src="/static/player_multi.js" type="module"></script>
</body>
</html>
