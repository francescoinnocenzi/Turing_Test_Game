<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Accedi</title>
        <link rel="stylesheet" href="../static/login.css">
    </head>
    <body>
        <main class="card">
            <h1 class="title">🔐 Accedi</h1>
            <p class="subtitle">
                Usa <strong>username</strong> <em>oppure</em>
                <strong>email</strong> + password.
            </p>

            <div id="msg" class="msg"></div>

            <form id="loginForm">
                <div class="field">
                    <label for="identifier">Username o Email</label>
                    <input id="identifier" name="identifier" type="text" autocomplete="username" required placeholder="es. mario.rossi o mario@email.it"/>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"/>
                    <div class="hint">
                        Non hai un account? Registrati qui sotto.
                    </div>
                </div>

                <button class="btn" type="submit">Entra</button>
            </form>

            <div class="links">
                Nessun account? <a href="/register">Crea un account</a>
            </div>
        </main>
    <script src="/static/login.js"></script>
    </body>
</html>
