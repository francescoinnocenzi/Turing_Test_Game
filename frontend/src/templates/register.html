<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Registrati</title>
        <style>
            :root {
                --grad-a: #ff6b6b;
                --grad-b: #ee5a24;
                --txt: #333;
                --muted: #6c757d;
                --card: #fff;
                --bd: #eee;
            }
            * {
                box-sizing: border-box;
            }
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(
                    135deg,
                    var(--grad-a) 0%,
                    var(--grad-b) 100%
                );
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 1.2rem;
            }
            .card {
                width: 100%;
                max-width: 520px;
                background: var(--card);
                border-radius: 20px;
                padding: 2rem;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
                animation: rise 0.5s ease;
            }
            h1 {
                margin: 0 0 0.25rem;
                text-align: center;
                color: var(--txt);
            }
            .subtitle {
                color: var(--muted);
                text-align: center;
                margin-bottom: 1.5rem;
                font-size: 0.95rem;
            }
            .grid {
                display: grid;
                gap: 1rem;
            }
            @media (min-width: 640px) {
                .grid.two {
                    grid-template-columns: 1fr 1fr;
                }
            }
            .field {
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
            }
            label {
                font-weight: 600;
                color: #444;
                font-size: 0.95rem;
            }
            input {
                padding: 0.9rem 1rem;
                border-radius: 14px;
                border: 2px solid var(--bd);
                font-size: 1rem;
                outline: none;
                transition: 0.2s;
            }
            input:focus {
                border-color: var(--grad-a);
                box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.18);
            }
            .btn {
                width: 100%;
                padding: 0.95rem 1rem;
                border: none;
                cursor: pointer;
                border-radius: 18px;
                font-weight: 700;
                letter-spacing: 0.2px;
                background: linear-gradient(
                    135deg,
                    var(--grad-a),
                    var(--grad-b)
                );
                color: white;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
                transition: transform 0.1s ease;
                margin-top: 0.5rem;
            }
            .btn:active {
                transform: translateY(1px);
            }
            .links {
                margin-top: 1rem;
                text-align: center;
                font-size: 0.95rem;
                color: var(--muted);
            }
            .links a {
                color: var(--grad-b);
                text-decoration: none;
                font-weight: 700;
            }
            .msg {
                margin: 0.75rem 0;
                padding: 0.8rem 1rem;
                border-radius: 12px;
                font-size: 0.95rem;
                display: none;
            }
            .msg.ok {
                background: #e9f8ee;
                color: #155724;
                border: 1px solid #c7eed8;
            }
            .msg.err {
                background: #ffecec;
                color: #7b1c1c;
                border: 1px solid #ffc9c9;
            }
            .hint {
                font-size: 0.85rem;
                color: #999;
                margin-top: 0.25rem;
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <main class="card">
            <h1>📝 Registrati</h1>
            <p class="subtitle">Crea un account per continuare.</p>

            <div id="msg" class="msg"></div>

            <form id="registerForm">
                <div class="grid">
                    <div class="field">
                        <label for="username">Username</label>
                        <input
                            id="username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            required
                            placeholder="es. mario.rossi"
                        />
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            placeholder="mario@email.it"
                        />
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password"type="password" autocomplete="new-password" required placeholder="••••••••"/>
                        <div class="hint">Minimo 8 caratteri consigliati.</div>
                    </div>

                    <div class="field">
                        <label for="password2">Conferma Password</label>
                        <input id="password2" name="password2" type="password" autocomplete="new-password" required placeholder="••••••••"/>
                    </div>
                </div>

                <button class="btn" type="submit">Crea account</button>
            </form>

            <div class="links">
                Hai già un account? <a href="/login">Accedi</a>
            </div>
        </main>

        <script>
            const form = document.getElementById("registerForm");
            const msg = document.getElementById("msg");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                msg.style.display = "none";

                const username = form.username.value.trim();
                const email = form.email.value.trim();
                const password = form.password.value;
                const password2 = form.password2.value;

                if (password !== password2) {
                    msg.className = "msg err";
                    msg.textContent = "Le password non coincidono.";
                    msg.style.display = "block";
                    return;
                }

                try {
                    const res = await fetch(
                        "http://localhost:8003/api/register",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                accept: "application/json",
                            },
                            body: JSON.stringify({ username, email, password }),
                        }
                    );

                    const data = await res.json();
                    if (!res.ok)
                        throw new Error(
                            data.detail || "Errore in registrazione"
                        );

                    msg.className = "msg ok";
                    msg.textContent = "Registrazione completata! ✅";
                    msg.style.display = "block";

                    // opzionale: redirect automatico al login
                    setTimeout(() => {
                        window.location.href = "/login";
                    }, 900);
                } catch (err) {
                    msg.className = "msg err";
                    msg.textContent = err.message || "Errore imprevisto";
                    msg.style.display = "block";
                }
            });
        </script>
    </body>
</html>
