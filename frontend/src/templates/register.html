<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Registrati</title>
        <style>
            body {
                font-family: 'Share Tech Mono', monospace;
                background: linear-gradient(135deg, #0f0f23 0%, #16213e 25%, #1a1a2e 50%, #0f0f23 100%);
                color: #e0e0e0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 1rem;

            }

                body::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: 
                    linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
                background-size: 50px 50px;
                pointer-events: none;
                z-index: -1;
            }

            .card {
                width: 100%;
                max-width: 520px;
                background: rgba(0, 255, 255, 0.03);
                backdrop-filter: blur(5px);
                border-radius: 12px;
                padding: 2rem;
                border: 1px solid rgba(0, 255, 255, 0.2);
                animation: rise 0.5s ease;
            }

            h1 {
                font-size: 2.5rem;
                font-weight: 900;
                margin: 0 0 0.5rem;
                text-shadow: 0 0 10px #00ffffc1;
                font-family: 'Orbitron', monospace;
                color: #00ffff;
                text-align: center;
            }

            .subtitle {
                color: rgba(224, 224, 224, 0.7);
                text-align: center;
                margin-bottom: 1.5rem;
                font-size: 0.95rem;
            }

            .grid {
                display: grid;
                gap: 1rem;
            }

            @media (min-width: 640px) {
                .grid.two {
                    grid-template-columns: 1fr 1fr;
                }
            }

            .field {
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
            }

            label {
                font-weight: 600;
                color: #e0e0e0;
                font-size: 0.95rem;
            }

            input {
                padding: 0.9rem 1rem;
                border-radius: 8px;
                border: 1px solid rgba(0, 255, 255, 0.3);
                background: rgba(0, 0, 0, 0.3);
                color: #e0e0e0;
                font-size: 1rem;
                outline: none;
                transition: all 0.3s ease;
            }

            input:focus {
                border-color: #00ffff;
                box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
                background: rgba(0, 0, 0, 0.5);
            }

            input::placeholder {
                color: rgba(224, 224, 224, 0.4);
            }

            .btn {
                margin-top: 2rem;
                width: 100%;
                padding: 0.95rem 1rem;
                border: none;
                cursor: pointer;
                border-radius: 18px;
                font-weight: 700;
                letter-spacing: 0.2px;
                background:#00ffff;
                color: black;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
                transition: transform 0.1s ease;
            }

            .btn:hover {
                box-shadow: 0 6px 20px rgba(0, 255, 255, 0.4);
                transform: translateY(-2px);
            }

            .btn:active {
                transform: translateY(0);
            }

            .links {
                margin-top: 1rem;
                text-align: center;
                font-size: 0.95rem;
                color: rgba(224, 224, 224, 0.7);
            }

            .links a {
                color: #00ffff;
                text-decoration: none;
                font-weight: 700;
                transition: color 0.3s ease;
            }

            .links a:hover {
                color: #66ffff;
            }

            .msg {
                margin: 0.75rem 0;
                padding: 0.8rem 1rem;
                border-radius: 8px;
                font-size: 0.95rem;
                display: none;
            }

            .msg.ok {
                background: rgba(0, 255, 0, 0.1);
                color: #00ff00;
                border: 1px solid rgba(0, 255, 0, 0.3);
            }

            .msg.err {
                background: rgba(255, 0, 0, 0.1);
                color: #ff6b6b;
                border: 1px solid rgba(255, 0, 0, 0.3);
            }

            .hint {
                font-size: 0.85rem;
                color: rgba(224, 224, 224, 0.5);
                margin-top: 0.25rem;
            }

            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <main class="card">
            <h1>📝 Registrati</h1>
            <p class="subtitle">Crea un account per continuare.</p>

            <div id="msg" class="msg"></div>

            <form id="registerForm">
                <div class="grid">
                    <div class="field">
                        <label for="username">Username</label>
                        <input
                            id="username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            required
                            placeholder="es. mario.rossi"
                        />
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            placeholder="mario@email.it"
                        />
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password"type="password" autocomplete="new-password" required placeholder="••••••••"/>
                        <div class="hint">Minimo 8 caratteri consigliati.</div>
                    </div>

                    <div class="field">
                        <label for="password2">Conferma Password</label>
                        <input id="password2" name="password2" type="password" autocomplete="new-password" required placeholder="••••••••"/>
                    </div>
                </div>

                <button class="btn" type="submit">Crea account</button>
            </form>

            <div class="links">
                Hai già un account? <a href="/login">Accedi</a>
            </div>
        </main>

        <script src="/static/register.js"></script>
    </body>
</html>
