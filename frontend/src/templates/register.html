<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Registrati</title>
        <link rel="stylesheet" href="../static/register.css">
    </head>
    <body>
        <main class="card">
            <h1>📝 Registrati</h1>
            <p class="subtitle">Crea un account per continuare.</p>

            <div id="msg" class="msg"></div>

            <form id="registerForm">
                <div class="grid">
                    <div class="field">
                        <label for="username">Username</label>
                        <input
                            id="username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            required
                            placeholder="es. mario.rossi"
                        />
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            placeholder="mario@email.it"
                        />
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password"type="password" autocomplete="new-password" required placeholder="••••••••"/>
                        <div class="hint">Minimo 8 caratteri consigliati.</div>
                    </div>

                    <div class="field">
                        <label for="password2">Conferma Password</label>
                        <input id="password2" name="password2" type="password" autocomplete="new-password" required placeholder="••••••••"/>
                    </div>
                </div>

                <button class="btn" type="submit">Crea account</button>
            </form>

            <div class="links">
                Hai già un account? <a href="/login">Accedi</a>
            </div>
        </main>

        <script src="/static/register.js"></script>
    </body>
</html>
