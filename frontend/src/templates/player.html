<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Partecipante - Chat</title>
    <link rel="stylesheet" href="../static/player.css">
</head>
<body>
    <div class="container">
        <div class="mode-badge">Partecipante</div>

        <div class="status-info">
            <!-- <span class="emoji">🆔</span>Your ID: <span id="ws-id"></span> |  -->
            <span class="emoji">🏠</span>Room: <span id="room-id">Seleziona una stanza</span>
        </div>
        
        <div id="current-question" class="current-question waiting">
            <span class="emoji">⏳</span>In attesa di una domanda dal giudice...
        </div>

        <div class="answer-form">
            <form id="messageForm" onsubmit="return false;">
                <input type="text" id="messageText" disabled="true" autocomplete="off" placeholder="⏳ Attendi la domanda del giudice..." />
                <button type="submit" disabled="true" class="send-button">📤 Invia</button>
            </form>
        </div>
        
        <!-- <div class="chat-history">
            <h3>📜 Cronologia Chat</h3>
            <ul id='messages'></ul>
        </div> -->
    </div>

    <script src="/static/player.js" type="module"></script>
</body>
</html>
