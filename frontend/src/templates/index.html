<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8" />
    <title>Turing Test Game - Home</title>
    <link rel="stylesheet" href="../static/index.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🤖 Turing Test Game</h1>
        <div class="subtitle">
            [ Scegli una modalità per iniziare ]
        </div>
        
        <div class="mode-buttons">
            <a href="/multiplayer" class="mode-button multiplayer-button">
                <h3>👤👤 MULTIPLAYER</h3>
                <div class="mode-description">
                    Gioca con un altro giocatore in tempo reale
                </div>
            </a>
            
            <a href="/singleplayer" class="mode-button singleplayer-button">
                <h3>👤 SINGLEPLAYER</h3>
                <div class="mode-description">
                    Gioca da solo in diverse modalità
                </div>
            </a>
            <!-- Nuovo pulsante classifica -->
            <a href="/ranking" id="show-ranking-btn" class="mode-button ranking-button">
                <h3>🏆 CLASSIFICA</h3>
                <div class="mode-description">
                    Visualizza la classifica dei migliori giocatori
                </div>
            </a>
        </div>
        <!-- Container per la classifica dentro il box principale -->
        <div id="ranking-container" style="margin-top: 2rem;"></div>

    </div>

</body>
</html>
