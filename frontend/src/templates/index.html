<!DOCTYPE html>
<html>
<head>
    <title>Turing Test Game - Home</title>
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background: linear-gradient(135deg, #0f0f23 0%, #16213e 25%, #1a1a2e 50%, #0f0f23 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title {
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px #00ffffc1;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0px;
            color: #00ffff;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }
        
        .container {
            text-align: center;
            width: 90%;
        }
        
        h1 {
            color: #ffffff;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #ffffff;
            margin-top: 3rem;
            margin-bottom: 3rem;
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.4;
        }
        
        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        a {
            text-decoration: none;
        }

        .mode-button h3{
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            margin-top: 0;
            color: #ffffff;
            font-family: 'Orbitron', monospace;
            text-align: center;
        }
        
        .mode-button {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
            color: #b3b3b3;
            margin-bottom: 1rem;
            font-size: 1rem;
            font-family: 'Share Tech Mono', monospace;
        }

        .mode-button:hover{
            background: rgba(0, 255, 255, 0.1);
            border-color: #00ffff;
            transform: translateY(-7px);
        }
        
        
        .mode-description {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 0.5rem;
            font-weight: normal;
        }
        
        
        @media (max-width: 600px) {
            .container {
                padding: 2rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .mode-button {
                padding: 1.2rem 1.5rem;
                font-size: 1.1rem;
            }
        }
        /* Nuovo stile per il pulsante classifica */
    /* .ranking-button {
        background: linear-gradient(135deg, #34ace0, #33d9b2);
        color: white;
        box-shadow: 0 8px 20px rgba(52, 172, 224, 0.3);
    }

    .ranking-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(52, 172, 224, 0.4);
    } */

    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🤖 Turing Test Game</h1>
        <div class="subtitle">
            [ Scegli una modalità per iniziare ]
        </div>
        
        <div class="mode-buttons">
            <a href="/multiplayer" class="mode-button multiplayer-button">
                <h3>👤 MULTIPLAYER</h3>
                <div class="mode-description">
                    Gioca con un altro giocatore in tempo reale
                </div>
            </a>
            
            <a href="/singleplayer" class="mode-button singleplayer-button">
                <h3>👤 SINGLEPLAYER</h3>
                <div class="mode-description">
                    Gioca da solo in diverse modalità
                </div>
            </a>
            <!-- Nuovo pulsante classifica -->
            <a href="/ranking" id="show-ranking-btn" class="mode-button ranking-button">
                <h3>🏆 CLASSIFICA</h3>
                <div class="mode-description">
                    Visualizza la classifica dei migliori giocatori
                </div>
            </a>
        </div>
        <!-- Container per la classifica dentro il box principale -->
        <div id="ranking-container" style="margin-top: 2rem;"></div>

    </div>

</body>
</html>
